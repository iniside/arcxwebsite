<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-label="Default DPI curve in Project Settings, User Interface: the scale by the shortest side of the viewport. 480 gives 0.444, 720 gives 0.666, 1080 gives 1.0, and 2160 gives 2.0 on the line to the key at 8640 with 8.0. A 1080p screen gives scale 1 and a 4K screen gives scale 2." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#111827">
<title>Default DPI curve in Project Settings, User Interface: the scale by the shortest side of the viewport. 480 gives 0.444, 720 gives 0.666, 1080 gives 1.0, and 2160 gives 2.0 on the line to the key at 8640 with 8.0. A 1080p screen gives scale 1 and a 4K screen gives scale 2.</title>
<rect x="0.5" y="0.5" width="799" height="329" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="80" y="26" font-weight="600">Default DPI curve (rule: shortest side)</text>
<line x1="80" y1="260" x2="740" y2="260" stroke="#374151" stroke-width="1.4"/>
<line x1="80" y1="260" x2="80" y2="40" stroke="#374151" stroke-width="1.4"/>
<line x1="80" y1="160" x2="720" y2="160" stroke="#d1d5db" stroke-dasharray="4 4"/><text x="70" y="164" text-anchor="end">1</text>
<line x1="80" y1="60" x2="720" y2="60" stroke="#d1d5db" stroke-dasharray="4 4"/><text x="70" y="64" text-anchor="end">2</text>
<text x="70" y="264" text-anchor="end">0</text><text x="24" y="150" transform="rotate(-90 24 150)" text-anchor="middle">scale</text>
<line x1="208" y1="260" x2="208" y2="266" stroke="#374151"/><text x="208" y="282" text-anchor="middle">480</text>
<line x1="272" y1="260" x2="272" y2="266" stroke="#374151"/><text x="272" y="282" text-anchor="middle">720</text>
<line x1="368" y1="260" x2="368" y2="266" stroke="#374151"/><text x="368" y="282" text-anchor="middle">1080</text>
<line x1="656" y1="260" x2="656" y2="266" stroke="#374151"/><text x="656" y="282" text-anchor="middle">2160</text>
<text x="410" y="306" text-anchor="middle">shortest side of the viewport, in pixels</text>
<polyline points="208,216 272,193 368,160 656,60" fill="none" stroke="#2563eb" stroke-width="2.2"/>
<circle cx="208" cy="216" r="4" fill="#2563eb"/>
<circle cx="272" cy="193" r="4" fill="#2563eb"/>
<circle cx="368" cy="160" r="4" fill="#2563eb"/>
<circle cx="656" cy="60" r="4" fill="#2563eb"/>
<rect x="400" y="130" width="250" height="44" rx="5" fill="#ffffff" stroke="#4b5563"/><text x="525" y="148" text-anchor="middle" font-weight="600">1920 x 1080: scale 1.0</text><text x="525" y="164" text-anchor="middle">1 px of CSS = 1 screen pixel</text>
<rect x="470" y="40" width="250" height="44" rx="5" fill="#ffffff" stroke="#4b5563"/><text x="595" y="58" text-anchor="middle" font-weight="600">3840 x 2160: scale 2.0</text><text x="595" y="74" text-anchor="middle">1 px of CSS = 2 screen pixels</text>
<text x="96" y="52" fill="#4b5563">The curve goes on to 8.0 at 8640.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 428" width="800" height="428" role="img" aria-label="Who decides the mouse cursor. The document's input-mode becomes a CommonUI input config on the topmost activated document: menu and all give mode Menu or All with NoCapture, and the cursor is shown. all with mouse-capture true gives mode All with CapturePermanently_IncludingInitialMouseDown, and the cursor is hidden, unless a text field wants keyboard focus or an element with data-mouse-release is shown, which gives All with NoCapture and shows it. game gives mode Game with CapturePermanently_IncludingInitialMouseDown, and the cursor is hidden, unless a text field wants keyboard focus, which gives Menu with NoCapture and shows it. Over an interactive element the CSS cursor property picks the cursor shape." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#111827">
<title>Who decides the mouse cursor. The document's input-mode becomes a CommonUI input config on the topmost activated document: menu and all give mode Menu or All with NoCapture, and the cursor is shown. all with mouse-capture true gives mode All with CapturePermanently_IncludingInitialMouseDown, and the cursor is hidden, unless a text field wants keyboard focus or an element with data-mouse-release is shown, which gives All with NoCapture and shows it. game gives mode Game with CapturePermanently_IncludingInitialMouseDown, and the cursor is hidden, unless a text field wants keyboard focus, which gives Menu with NoCapture and shows it. Over an interactive element the CSS cursor property picks the cursor shape.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0.5" y="0.5" width="799" height="427" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="30" y="24" font-weight="600">input-mode</text><text x="320" y="24" font-weight="600">CommonUI input config</text><text x="620" y="24" font-weight="600">Mouse cursor</text>
<rect x="30" y="40" width="230" height="50" rx="5" fill="#ffffff" stroke="#4b5563"/><text x="42" y="62" font-weight="600">menu</text>
<line x1="260" y1="65" x2="320" y2="65" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="320" y="40" width="260" height="50" rx="5" fill="#ffffff" stroke="#4b5563"/><text x="332" y="62" font-weight="600">Menu, NoCapture</text>
<line x1="580" y1="65" x2="620" y2="65" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/><rect x="620" y="40" width="150" height="50" rx="5" fill="#d1e7d1" stroke="#4b5563"/><text x="695" y="69" text-anchor="middle" font-weight="600">shown</text>
<rect x="30" y="104" width="230" height="50" rx="5" fill="#ffffff" stroke="#4b5563"/><text x="42" y="126" font-weight="600">all</text>
<line x1="260" y1="129" x2="320" y2="129" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="320" y="104" width="260" height="50" rx="5" fill="#ffffff" stroke="#4b5563"/><text x="332" y="126" font-weight="600">All, NoCapture</text>
<line x1="580" y1="129" x2="620" y2="129" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/><rect x="620" y="104" width="150" height="50" rx="5" fill="#d1e7d1" stroke="#4b5563"/><text x="695" y="133" text-anchor="middle" font-weight="600">shown</text>
<rect x="30" y="168" width="230" height="50" rx="5" fill="#ffffff" stroke="#4b5563"/><text x="42" y="190" font-weight="600">game</text>
<line x1="260" y1="193" x2="320" y2="193" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="320" y="168" width="260" height="50" rx="5" fill="#ffffff" stroke="#4b5563"/><text x="332" y="190" font-weight="600">Game, CapturePermanently_</text><text x="332" y="204">IncludingInitialMouseDown</text>
<line x1="580" y1="193" x2="620" y2="193" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/><rect x="620" y="168" width="150" height="50" rx="5" fill="#e5e7eb" stroke="#4b5563"/><text x="695" y="197" text-anchor="middle" font-weight="600">hidden</text>
<rect x="30" y="232" width="230" height="50" rx="5" fill="#ffffff" stroke="#4b5563"/><text x="42" y="254" font-weight="600">game, text field active</text>
<line x1="260" y1="257" x2="320" y2="257" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="320" y="232" width="260" height="50" rx="5" fill="#ffffff" stroke="#4b5563"/><text x="332" y="254" font-weight="600">Menu, NoCapture</text>
<line x1="580" y1="257" x2="620" y2="257" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/><rect x="620" y="232" width="150" height="50" rx="5" fill="#d1e7d1" stroke="#4b5563"/><text x="695" y="261" text-anchor="middle" font-weight="600">shown</text>
<rect x="30" y="296" width="230" height="50" rx="5" fill="#ffffff" stroke="#4b5563"/><text x="42" y="318" font-weight="600">all, mouse-capture true</text>
<line x1="260" y1="321" x2="320" y2="321" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="320" y="296" width="260" height="50" rx="5" fill="#ffffff" stroke="#4b5563"/><text x="332" y="318" font-weight="600">All, CapturePermanently_</text><text x="332" y="332">IncludingInitialMouseDown</text>
<line x1="580" y1="321" x2="620" y2="321" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/><rect x="620" y="296" width="150" height="50" rx="5" fill="#e5e7eb" stroke="#4b5563"/><text x="695" y="325" text-anchor="middle" font-weight="600">hidden</text>
<rect x="30" y="360" width="230" height="50" rx="5" fill="#ffffff" stroke="#4b5563"/><text x="42" y="382" font-weight="600">all, mouse-capture true,</text><text x="42" y="396">data-mouse-release shown</text>
<line x1="260" y1="385" x2="320" y2="385" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="320" y="360" width="260" height="50" rx="5" fill="#ffffff" stroke="#4b5563"/><text x="332" y="382" font-weight="600">All, NoCapture</text>
<line x1="580" y1="385" x2="620" y2="385" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/><rect x="620" y="360" width="150" height="50" rx="5" fill="#d1e7d1" stroke="#4b5563"/><text x="695" y="389" text-anchor="middle" font-weight="600">shown</text>
</svg>

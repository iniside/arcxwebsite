<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1181 606" width="1181" height="606" role="img" aria-label="Blueprint graph of the Open function of BP_SourceContext_Open: Viewmodel Game Subsytem, reached with the Player Controller as World Context, gives Get View Model Collection; Make MVVMView Model Context with Context Class ArcRmlSamplesSourceContextViewModel and Context Name VM_SampleContext. The function entry Open runs Remove View Model on the collection with that context, Construct Arc Rml Samples Source Context View Model with the game subsystem as Outer, SET w/ Broadcast with Label From the GameInstance collection, Add View Model Instance with the context and the new instance, then Open Document on Arc Rml Viewport Subsystem with the reference from Make Arc Rml Document Ref for /ArcRmlUISamples/UI/Rml/SourceContext/SourceContext.rml; a Branch on its Return Value runs the Return Node, which outputs the document reference." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#111827">
